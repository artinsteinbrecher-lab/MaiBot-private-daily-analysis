[plugin]
enabled = false
config_version = "3.6.2"

[summary]
coverage_mode = "完整覆盖"
detail_level = "完整"
max_events = 12
# 0 表示普通话题不设用户上限；插件仍保留 500 条安全上限。
max_minor_events = 0
refine_major_events = true
anchors_per_event = 2
events_per_page = 4
# 仅用于均衡抽样模式；完整覆盖模式会分析全部有效文本消息。
max_input_messages = 1200
include_anchor_quotes = true
include_links = true

[user_summary]
# 事实型 /mysummary：只展示可观察话题、表达特点、样本时段和真实原话依据。
enabled = false
view_others_mode = "白名单"
allowed_users = []

[auto_summary]
enabled = false
time = "00:10"
timezone = "Asia/Shanghai"
min_messages = 10
# 自动与手动总结共用的来源群白名单。必须使用字符串。
target_chats = ["123456789", "987654321"]
# 自动日报唯一接收 QQ。留空时自动任务不会读取或生成日报。
recipient_user = "111111111"

[command_permission]
# 允许私聊执行 /summary 的管理员。自动接收 QQ 也必须在此列表中。
admin_users = ["111111111"]

[advanced]
# 插件不保存供应商、URL、API Key 或模型 ID。增强补丁只向 MaiBot 注册：
# plugin_daily_extract、plugin_daily_compose、plugin_daily_verify、plugin_user_profile。
# 任一专用任务未配置时由 MaiBot 真实回退 replyer；未应用补丁时插件也统一跟随 replyer。
inject_memory = false
llm_timeout_seconds = 180
render_timeout_seconds = 25
message_interval_seconds = 1.0
image_settle_seconds = 2.0
group_timeout_seconds = 1800
event_chunk_messages = 120
event_chunk_characters = 8000
event_retry_count = 2
split_chunk_on_failure = true
# 每次精炼调用包含的主要事件数量。plugin_daily_compose 使用推理型模型
# （思考与最终 JSON 共用输出预算，如 DeepSeek V4 Flash）时建议改为 1-2。
refine_batch_size = 4
# 同时发起的 LLM 调用数量。聚合渠道单次响应普遍超过 1 分钟、高流量群
# 因单群超时只完成部分覆盖时改为 3-4；渠道会限流时保持 2。
llm_concurrency = 2
